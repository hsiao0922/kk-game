<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小魔法師闖鬼屋">
<meta name="theme-color" content="#1b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>小小魔法師闖鬼屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>
/* 版面：鬼屋夜晚的一個舞台，畫布置中，下方是音樂／全螢幕按鈕與作者署名 */
:root {
  --night: #1b1530;
  --plum: #2b2046;
  --plum-line: #4a3a72;
  --candle: #f6c453;
  --pumpkin: #f08a24;
  --ink: #f3ecff;
  --mute: #b4a6d4;
  --font-play: "Chiron GoRound TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-play);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 16px 24px;
}
header { text-align: center; display: grid; gap: 2px; }
h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); font-weight: 900; letter-spacing: .04em; color: var(--candle); text-wrap: balance; }
header p { margin: 0; font-size: 14px; color: var(--mute); letter-spacing: .06em; }
.stage {
  position: relative;
  width: 100%;
  max-width: min(1100px, calc((100vh - 190px) * 16 / 9));
  max-width: min(1100px, calc((100dvh - 190px) * 16 / 9));
  min-width: min(100%, 320px);
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  background: var(--plum);
  box-shadow: 0 0 0 3px var(--plum-line), 0 18px 50px rgba(0,0,0,.45);
}
.stage, .stage canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.stage:fullscreen { max-width: none; width: 100vw; height: 100vh; border-radius: 0; display: grid; place-items: center; background: #000; box-shadow: none; }
.stage:fullscreen canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
/* iPhone 等不支援全螢幕 API 時：讓遊戲畫面鋪滿整個視窗 */
body.pseudo-full { overflow: hidden; }
body.pseudo-full .stage {
  position: fixed; inset: 0; z-index: 50; max-width: none; min-width: 0; width: 100vw; height: 100vh; height: 100dvh;
  border-radius: 0; box-shadow: none; background: #000; display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
body.pseudo-full .stage canvas { width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
.exit-full, .rotate-hint { display: none; }
body.pseudo-full .exit-full {
  display: block; position: absolute; left: calc(env(safe-area-inset-left, 0px) + 6px); top: calc(env(safe-area-inset-top, 0px) + 6px);
  font: 700 12px var(--font-play); color: var(--ink); background: rgba(27,21,48,.85); border: 2px solid var(--plum-line); border-radius: 999px; padding: 4px 9px; line-height: 1.3;
}
@media (orientation: portrait) {
  body.pseudo-full .rotate-hint { display: block; position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 0; right: 0; text-align: center; color: var(--candle); font: 700 18px var(--font-play); }
}
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.bar button {
  font: 700 15px var(--font-play);
  color: var(--ink); background: var(--plum);
  border: 2px solid var(--plum-line); border-radius: 999px;
  padding: 8px 16px; cursor: pointer;
}
.bar button:hover { border-color: var(--candle); }
.bar button:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }
.bar .hint { font-size: 13px; color: var(--mute); }
.credit { margin: 0; font-size: 13px; color: var(--mute); text-align: center; max-width: 60ch; line-height: 1.7; }
.credit b { color: var(--pumpkin); font-weight: 700; }
@media (orientation: landscape) and (max-height: 500px) {
  header, .credit { display: none; }
  main { padding-block: 6px; gap: 6px; }
  .stage { max-width: min(1100px, calc((100dvh - 60px) * 16 / 9)); }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>小小魔法師闖鬼屋</h1>
    <p>小里肌的漫畫小遊戲・共 3 關</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="game" aria-label="小小魔法師闖鬼屋遊戲畫面"></canvas>
    <p class="rotate-hint">把手機轉成橫的，畫面會更大</p>
    <button class="exit-full" id="btn-exit-full" type="button">✕ 離開</button>
  </div>
  <div class="bar">
    <button id="btn-music" type="button">音樂：開</button>
    <button id="btn-full" type="button">全螢幕</button>
    <span class="hint">電腦：A D 或方向鍵走、空白鍵跳、滑鼠左鍵放魔法星星。手機平板：左半邊按住拖曳走路、右下跳和魔法按鈕，橫放比較好玩。</span>
  </div>
  <p class="credit">角色和故事：<b>小里肌（8 歲）</b>・主角小小魔法師：小里肌本人（蠟筆風）・上色和補畫動作：Gemini・遊戲程式：Claude・版本 <span id="ver"></span></p>
</main>

<script>
(() => {
'use strict';
// 版本號：每次改遊戲（新增關卡、修正、換素材）都要加；加入主畫面的玩家靠它判斷要不要更新
const VERSION = '1.0.0';
const W = 960, H = 540, GROUND = 488, PX = 210;
const GRAV = 2300, JUMP_V = -900, CUT_V = -380;
const LEVELS = {
  1: { speed: 300, end: 10800, name: '第 1 關　闖進鬼屋' },
  2: { speed: 320, end: 11600, name: '第 2 關　大狗出場' },
  3: { speed: 320, end: 9800, name: '第 3 關　容容變怪物了！' },
};
let lvl = 1, SPEED = 300, END = 10800;
const FONT = '"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif';
const CHAR_H = 132;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

// ---------- 素材 ----------
const NAMES = ['kk_1','kk_2','kk_3','kk_4','kk_5','kk_front','mon_1','mon_2','mon_3','mon_4','monster_front',
  'rongrong','dog','fish','heart','star','ghost','pumpkin','crate',
  'keli_1','keli_2','keli_3','keli_4','keli_5','bear_1','bear_2','bear_3','bear_4','jiao_1','jiao_2','jiao_3','candle','spirit','circle',
  'wiz_stand','wiz_w1','wiz_w2','wiz_jump','wiz_hurt','wiz_wave','wiz_cast','magic_star','item_book','item_vase','item_box'];
const IMG = {};
function loadImg(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
let bgTile = null, bgTileW = 0;

// ---------- 儲存（可能不可用） ----------
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const bests = { 1: +(store('kk_best') || 0), 2: +(store('kk_best2') || 0), 3: +(store('kk_best3') || 0) };
let unlocked2 = store('kk_unlock2') === '1';
let unlocked3 = store('kk_unlock3') === '1';
// 第 3 關的主角是顆力，其他關是顆顆
const HERO = {
  kk: { stand: 'kk_1', w1: 'kk_2', w2: 'kk_3', jump: 'kk_4', hurt: 'kk_5', icon: 'kk_front' },
  keli: { stand: 'keli_1', w1: 'keli_2', w2: 'keli_3', jump: 'keli_4', hurt: 'keli_5', icon: 'keli_1' },
};
HERO.wiz = { stand: 'wiz_stand', w1: 'wiz_w1', w2: 'wiz_w2', jump: 'wiz_jump', hurt: 'wiz_hurt', icon: 'wiz_wave', cast: 'wiz_cast' };
// 主角可以選小魔法師（預設，可以放魔法星星）或原本的貓咪
let heroChoice = store('kk_hero') === 'cat' ? 'cat' : 'wiz';
const isWiz = () => heroChoice === 'wiz';
const hero = () => isWiz() ? HERO.wiz : HERO[lvl === 3 ? 'keli' : 'kk'];
let muted = store('kk_muted') === '1';

// ---------- 音效（WebAudio 合成） ----------
let ac = null;
const bgm = new Audio('assets/bgm.mp3');
bgm.loop = true; bgm.volume = 0.32;
function audioOn() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  if (!muted && bgm.paused) bgm.play().catch(() => {});
}
function tone(type, f0, f1, dur, vol = 0.18, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const SFX = {
  jump: () => tone('square', 320, 640, 0.14, 0.08),
  fish: () => { tone('triangle', 880, 880, 0.07, 0.15); tone('triangle', 1320, 1320, 0.1, 0.15, 0.06); },
  star: () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.14, 0.16, i * 0.07)),
  heart: () => [660, 880].forEach((f, i) => tone('sine', f, f * 1.2, 0.15, 0.18, i * 0.09)),
  stomp: () => tone('sine', 520, 140, 0.25, 0.25),
  hurt: () => tone('sawtooth', 300, 90, 0.35, 0.12),
  thunder: () => noise(1.6, 0.9, 380),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.2, 0.17, i * 0.12)),
  over: () => [392, 330, 262].forEach((f, i) => tone('triangle', f, f * 0.98, 0.3, 0.16, i * 0.2)),
};

// ---------- 關卡 ----------
function buildLevel(n) {
  const L = [];
  const fish = (x, y) => L.push({ t: 'fish', x, y, r: 24 });
  const row = (x, n, y = GROUND - 70, gap = 70) => { for (let i = 0; i < n; i++) fish(x + i * gap, y); };
  const arc = (x, n = 5, top = GROUND - 250) => {
    for (let i = 0; i < n; i++) { const u = i / (n - 1); fish(x + i * 62, GROUND - 70 - (GROUND - 70 - top) * 4 * u * (1 - u)); }
  };
  const pumpkin = x => L.push({ t: 'pumpkin', x, w: 56, h: 58 });
  const crate = x => L.push({ t: 'crate', x, w: 86, h: 86 });
  const ghost = (x, y = GROUND - 222) => L.push({ t: 'ghost', x, y0: y, ph: x % 7 });
  const mon = (x, hop = false) => L.push({ t: 'mon', x, y: GROUND, vx: hop ? -50 : -70, vy: 0, rot: 0, state: 'walk', anim: 0, hop });
  const star = (x, y) => L.push({ t: 'star', x, y, r: 30 });
  const heart = (x, y) => L.push({ t: 'heart', x, y, r: 26 });
  const pit = x => L.push({ t: 'pit', x, w: 120 });
  // 魔術道具（小魔法師才有）：book 畫冊、vase 紅球花瓶、box 魔術盒
  const magic = (x, kind) => { if (isWiz()) L.push({ t: 'magic', kind, x, y: GROUND - 190, r: 34 }); };
  const candle = x => L.push({ t: 'candle', x, w: 40, h: 74 });
  const circle = x => L.push({ t: 'circle', x });
  const spirit = (x, y = GROUND - 215) => L.push({ t: 'ghost', kind: 'spirit', x, y0: y, ph: x % 5 });

  if (n === 1) {
    row(900, 5);
    pumpkin(1650); arc(1560);
    row(2000, 4);
    mon(2500);
    crate(2950); row(2905, 2, GROUND - 160, 90);
    ghost(3400); row(3250, 6);
    pumpkin(3900); pumpkin(4180);
    crate(4600); star(4600, GROUND - 300);
    mon(5050); mon(5400); arc(5150, 5, GROUND - 270);
    heart(5900, GROUND - 210);
    ghost(6300); ghost(6620, GROUND - 205); row(6200, 7);
    crate(7000); crate(7260); row(6980, 4, GROUND - 160, 90);
    mon(7700); arc(7620, 6, GROUND - 280);
    pumpkin(8200); star(8200, GROUND - 230);
    mon(8650); mon(8920);
    pumpkin(9350); ghost(9680);
    star(10050, GROUND - 190);
    row(10250, 5);
    magic(2300, 'box'); magic(6100, 'vase'); magic(8500, 'book');
  } else if (n === 3) {
    // 第 3 關：蠟燭、魔法陣、紫色附身怪，最後和變成怪物熊的容容對決
    row(800, 5);
    candle(1500); circle(1750);
    mon(2150); pit(2650); arc(2526, 5, GROUND - 240);
    spirit(3100); row(2950, 6);
    candle(3550); candle(3830);
    crate(4250); star(4250, GROUND - 300);
    mon(4750, true); spirit(5150, GROUND - 200);
    pit(5650); heart(5950, GROUND - 210);
    mon(6350); mon(6600); candle(7050); circle(7280);
    spirit(7550); row(7450, 6);
    pit(8050); star(8050, GROUND - 250);
    mon(8650, true); star(9200, GROUND - 200); row(9400, 4);
    magic(2000, 'vase'); magic(6150, 'book'); magic(9450, 'box');
  } else {
    // 第 2 關：地板有破洞、怪物貓會跳，最後大狗出場
    row(800, 5);
    pit(1500); arc(1376, 5, GROUND - 240);
    mon(2050); mon(2550, true);
    crate(3000); crate(3086); row(2960, 3, GROUND - 160, 60);
    pit(3550); star(3550, GROUND - 250);
    row(3950, 6); mon(4400, true);
    pumpkin(4850); pit(5250); arc(5126, 5, GROUND - 240);
    heart(5750, GROUND - 210);
    mon(6150); mon(6380); mon(6700, true);
    ghost(7150, GROUND - 205); ghost(7420, GROUND - 235); row(7050, 7);
    pit(7950); crate(8300); star(8300, GROUND - 300);
    mon(8850, true); pumpkin(9250);
    pit(9650); heart(9650, GROUND - 230);
    mon(10150); mon(10400, true);
    star(10900, GROUND - 200);
    row(11150, 5);
    magic(4100, 'vase'); magic(6000, 'book'); magic(9950, 'box');
  }
  return L;
}

// ---------- 狀態 ----------
let state = 'title', stateT = 0;
let P, level, camX = 0, fishN = 0, starN = 0, stomps = 0, hearts = 3, score = 0, falls = 0;
let particles = [], popups = [], flash = 0, nextFlash = 4;
let holding = false, totalT = 0;
let B = null; // 第 3 關的魔王（怪物熊容容）
let shots = []; // 小魔法師的魔法星星

function reset(n = lvl) {
  lvl = n; SPEED = LEVELS[n].speed; END = LEVELS[n].end; falls = 0;
  P = { x: 0, y: GROUND, vy: 0, onGround: true, inv: 0, hurtT: 0, coyote: 0, buffer: 0, walkT: 0, prevY: GROUND, castT: 0, cool: 0, ghostT: 0, tripleT: 0, vx: 0, face: 1, prevX: 0 };
  shots = [];
  level = buildLevel(n); camX = 0; fishN = 0; starN = 0; stomps = 0; hearts = 3; score = 0;
  particles = []; popups = []; flash = 0; nextFlash = 5; B = null;
}
reset(1);

function setState(s) { state = s; stateT = 0; }

// ---------- 輸入 ----------
function press(px, py) {
  audioOn();
  if (state === 'title') {
    if (px != null && px < 300 && py < 76) {
      heroChoice = isWiz() ? 'cat' : 'wiz'; store('kk_hero', heroChoice); SFX.fish(); return;
    }
    // 標題畫面：點第 2、3 關按鈕（已解鎖）就玩那一關，其他地方都是第 1 關
    let pick = 1;
    if (px != null && py > 430) pick = px < W / 2 - 115 ? 1 : px < W / 2 + 115 ? 2 : 3;
    if ((pick === 2 && !unlocked2) || (pick === 3 && !unlocked3)) { SFX.hurt(); return; }
    reset(pick); setState('play'); return;
  }
  if (state === 'win' && stateT > (lvl === 3 ? 5.2 : 1.6)) {
    if (lvl < 3) { reset(lvl + 1); setState('play'); } else setState('title');
    return;
  }
  if (state === 'over' && stateT > 1.0) { reset(lvl); setState('play'); return; }
  if (state === 'play') jumpDown();
}
function jumpDown() { holding = true; P.buffer = 0.13; }
function release() {
  holding = false;
  if (state === 'play' && P.vy < CUT_V) P.vy = CUT_V;
}

// 操作：桌機 A/D 或 ←/→ 移動、空白鍵/W/↑ 跳、滑鼠左鍵（按住連發）放魔法星星；
// 手機平板：左半邊按住拖曳就出現圓形搖桿（往上推 = 跳），右下「跳」「魔法」按鈕一直顯示，可以多指同時按
const keys = { left: false, right: false };
const touchHeld = new Map(); // pointerId → 按鈕名稱
let mouseFire = false, keyFire = false;
let touchUI = window.matchMedia?.('(pointer: coarse)').matches || 'ontouchstart' in window;
const BTN = { attack: { x: 760, y: 462, r: 50 }, jump: { x: 876, y: 420, r: 60 } };
const STICK_R = 70;
let stick = null; // { id, ox, oy, x, y, jumped }
function hitButton(px, py) {
  for (const k in BTN) {
    if (k === 'attack' && !isWiz()) continue;
    const b = BTN[k]; if (Math.hypot(px - b.x, py - b.y) < b.r + 14) return k;
  }
  return null;
}
const held = name => [...touchHeld.values()].includes(name);
const stickDX = () => stick ? stick.x - stick.ox : 0;
const inputLeft = () => keys.left || stickDX() < -16;
const inputRight = () => keys.right || stickDX() > 16;
const wantFire = () => isWiz() && (mouseFire || keyFire || held('attack'));
function toLocal(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [px, py] = toLocal(e);
  if (state !== 'play') { press(px, py); return; }
  audioOn();
  if (e.pointerType === 'mouse') { if (e.button === 0 && isWiz()) { mouseFire = true; shoot(); } return; }
  touchUI = true;
  const b = hitButton(px, py);
  if (!b) {
    if (px < W * 0.6 && !stick) { stick = { id: e.pointerId, ox: px, oy: py, x: px, y: py, jumped: false }; touchHeld.set(e.pointerId, 'stick'); }
    return;
  }
  touchHeld.set(e.pointerId, b);
  if (b === 'jump') jumpDown();
  if (b === 'attack') shoot();
});
window.addEventListener('pointermove', e => {
  if (!stick || e.pointerId !== stick.id) return;
  const [px, py] = toLocal(e);
  let dx = px - stick.ox, dy = py - stick.oy; const d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
  stick.x = stick.ox + dx; stick.y = stick.oy + dy;
  // 往上推 = 跳
  if (dy < -STICK_R * 0.7 && !stick.jumped) { stick.jumped = true; if (state === 'play') jumpDown(); }
  else if (dy > -STICK_R * 0.4 && stick.jumped) { stick.jumped = false; release(); }
});
function pointerEnd(e) {
  if (e.pointerType === 'mouse') { mouseFire = false; return; }
  const b = touchHeld.get(e.pointerId); touchHeld.delete(e.pointerId);
  if (b === 'stick') { if (stick && stick.jumped) release(); stick = null; }
  if (b === 'jump' && !held('jump')) release();
}
window.addEventListener('pointerup', pointerEnd);

// ---------- 碰撞 ----------
const pBox = () => ({ l: P.x - 26, r: P.x + 26, t: P.y - 112, b: P.y });
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;

function hurt(force) {
  if (P.inv > 0 && !force) return;
  hearts--; P.inv = 1.6; P.hurtT = 0.55; P.vy = Math.min(P.vy, -420); P.onGround = false;
  SFX.hurt(); flash = Math.max(flash, 0.25);
  if (hearts <= 0) { SFX.over(); bgm.pause(); setState('over'); }
}
function sparkle(x, y, color, n = 10) {

    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6 + Math.random() * 0.4, c: color, s: 4 + Math.random() * 5 });
  }
}

// ---------- 魔法星星 ----------
function shoot() {
  if (P.cool > 0 || P.inPit) return;
  P.cool = 0.32; P.castT = 0.25;
  const spread = P.tripleT > 0 ? [-170, 0, 170] : [0];
  for (const vy of spread) shots.push({ x: P.x + 46 * P.face, y: P.y - 84, vy, dir: P.face, life: 1.2 });
  tone('triangle', 900, 1500, 0.12, 0.12); tone('sine', 1800, 2400, 0.1, 0.06, 0.05);
}
function updateShots(dt) {
  for (const s of shots) {
    s.x += 780 * (s.dir || 1) * dt; s.y += (s.vy || 0) * dt; s.life -= dt;
    if (Math.random() < 0.6) particles.push({ x: s.x - 30 * (s.dir || 1), y: s.y + (Math.random() - .5) * 16, vx: -60, vy: (Math.random() - .5) * 40,
      life: 0.35, c: ['#ffe27a', '#ff9fb0', '#9be3ff', '#c58bff'][Math.floor(Math.random() * 4)], s: 5, confetti: true });
    if (s.x > camX + W + 60 || s.x < camX - 60) s.life = 0;
    const box = { l: s.x - 22, r: s.x + 22, t: s.y - 18, b: s.y + 18 };
    for (const e of level) {
      if (s.life <= 0) break;
      if (e.dead || Math.abs(e.x - s.x) > 90) continue;
      if (e.t === 'mon' && e.state === 'walk' && overlap(box, { l: e.x - 30, r: e.x + 30, t: e.y - 108, b: e.y })) {
        e.state = 'dizzy'; e.vy = -420; e.vx = 220; stomps++; score += 30; s.life = 0;
        SFX.stomp(); sparkle(e.x, e.y - 60, '#ffe27a', 14); popup(e.x, e.y - 120, '+30');
      } else if (e.t === 'ghost' && !e.hit) {
        const gy = e.y0 + Math.sin(totalT * 2.4 + e.ph) * (e.kind === 'spirit' ? 38 : 22);
        if (overlap(box, { l: e.x - 26, r: e.x + 26, t: gy - 30, b: gy + 30 })) {
          e.dead = true; score += 30; s.life = 0; SFX.star(); sparkle(e.x, gy, e.kind === 'spirit' ? '#c58bff' : '#ffffff', 16); popup(e.x, gy - 30, '+30');
        }
      } else if (e.t === 'candle' && !e.hit && overlap(box, { l: e.x - 16, r: e.x + 16, t: GROUND - e.h - 20, b: GROUND })) {
        e.hit = true; s.life = 0; sparkle(e.x, GROUND - e.h, '#cfd8ff', 10); popup(e.x, GROUND - e.h - 30, '熄滅！', '#cfe6ff');
      } else if (e.t === 'crate' && overlap(box, { l: e.x - e.w / 2, r: e.x + e.w / 2, t: GROUND - e.h, b: GROUND })) {
        s.life = 0; sparkle(s.x, s.y, '#ffe27a', 6);
      }
    }
    if (s.life > 0 && B && B.hp > 0 && ['charge', 'roar', 'enter', 'back'].includes(B.mode)
        && overlap(box, { l: B.x - 40, r: B.x + 40, t: B.y - BOSS_H, b: B.y })) {
      s.life = 0; B.hp = Math.round((B.hp - 0.34) * 100) / 100; B.flash = 0.15; score += 40;
      SFX.stomp(); sparkle(B.x, B.y - 90, '#c58bff', 12);
      if (B.hp <= 0.01) {
        B.hp = 0; B.mode = 'free'; B.t = 0; SFX.star();
        particles.push({ x: B.x, y: B.y - BOSS_H, vx: 160, vy: -260, life: 2.2, spirit: true, s: 0 });
      }
    }
  }
  shots = shots.filter(s => s.life > 0);
}

// ---------- 更新 ----------
function update(dt) {
  totalT += dt; stateT += dt;
  // 閃電
  nextFlash -= dt;
  if (nextFlash <= 0 && state !== 'over') { flash = 0.7; nextFlash = 6 + Math.random() * 5; SFX.thunder(); }
  flash = Math.max(0, flash - dt * 2.2);

  if (state === 'title') { camX += 40 * dt; if (pendingUpdate) applyUpdate(); return; }
  if (state === 'play') updatePlay(dt);
  if (state === 'win') camX += (END - PX - camX) * Math.min(1, dt * 6);
  if (state === 'win' && Math.random() < 0.5) {
    particles.push({ x: camX + Math.random() * W, y: -10, vx: (Math.random() - .5) * 60, vy: 120 + Math.random() * 120,
      life: 3, c: ['#f6c453', '#f08a24', '#7ad3ff', '#ff7aa8', '#9be36b'][Math.floor(Math.random() * 5)], s: 6 + Math.random() * 5, confetti: true });
  }
  if (state === 'over') { P.vy += GRAV * dt * 0.6; P.y = Math.min(GROUND, P.y + P.vy * dt); }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.confetti && !p.spirit) p.vy += 600 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function updatePlay(dt) {
  // 自由左右走動
  const dir = (inputRight() ? 1 : 0) - (inputLeft() ? 1 : 0);
  if (dir) P.face = dir;
  P.prevX = P.x;
  if (!P.inPit) {
    P.vx += (dir * SPEED - P.vx) * Math.min(1, dt * (dir ? 10 : 14));
    P.x += P.vx * dt;
  } else P.vx = 0;
  const minX = B ? END - PX + 40 : 30;
  if (P.x < minX) { P.x = minX; P.vx = 0; }
  if (P.x > END) { P.x = END; P.vx = Math.min(0, P.vx); }
  const camTarget = B ? END - PX : Math.max(0, Math.min(P.x - 380, END - PX));
  camX += (camTarget - camX) * Math.min(1, dt * 8);
  P.inv = Math.max(0, P.inv - dt); P.hurtT = Math.max(0, P.hurtT - dt);
  P.buffer -= dt; P.coyote = P.onGround ? 0.1 : P.coyote - dt;
  if (Math.abs(P.vx) > 30) P.walkT += dt * Math.abs(P.vx) / SPEED;
  if (wantFire() && P.cool <= 0) shoot();
  P.cool = Math.max(0, P.cool - dt); P.castT = Math.max(0, P.castT - dt);
  P.ghostT = Math.max(0, P.ghostT - dt); P.tripleT = Math.max(0, P.tripleT - dt);
  updateShots(dt);
  if (P.buffer > 0 && P.coyote > 0) { P.vy = JUMP_V; P.onGround = false; P.coyote = 0; P.buffer = 0; SFX.jump(); if (!holding) P.vy = CUT_V * 1.6; }

  P.prevY = P.y;
  P.vy += GRAV * dt; P.y += P.vy * dt; P.onGround = false;
  const overPit = level.some(e => e.t === 'pit' && Math.abs(P.x - e.x) < e.w / 2 - 12);
  if (overPit && P.y > GROUND + 6) P.inPit = true;
  if (P.y >= GROUND && !overPit && !P.inPit) { P.y = GROUND; P.vy = 0; P.onGround = true; }
  if (P.y > GROUND + 170) {
    // 掉進洞裡：扣一顆愛心，從洞的另一邊重新掉下來
    const pt = level.find(e => e.t === 'pit' && Math.abs(P.x - e.x) < e.w);
    falls++; hurt(true);
    if (state !== 'play') return;
    const side = P.face >= 0 ? 1 : -1;
    P.x = pt ? pt.x + side * (pt.w / 2 + 50) : P.x + 120 * side; P.y = GROUND - 240; P.vy = 0; P.vx = 0; P.prevY = P.y; P.inPit = false;
  }

  const pb = pBox();
  for (const e of level) {
    if (e.dead || e.x < camX - 200 || e.x > camX + W + 200) continue;
    if (e.t === 'crate') {
      const top = GROUND - e.h, l = e.x - e.w / 2, r = e.x + e.w / 2;
      if (pb.r - 6 > l && pb.l + 6 < r) {
        if (P.vy >= 0 && P.prevY <= top + 6 && P.y >= top) { P.y = top; P.vy = 0; P.onGround = true; }
        else if (P.y > top + 10) {
          // 木箱是牆：從哪邊撞就被擋在哪邊
          P.x = P.prevX <= e.x ? l - 20 : r + 20; P.vx = 0;
        }
      }
    } else if (e.t === 'circle') {
      continue;
    } else if (e.t === 'candle') {
      if (!e.hit && overlap(pb, { l: e.x - 14, r: e.x + 14, t: GROUND - e.h + 14, b: GROUND })) { e.hit = true; hurt(); sparkle(e.x, GROUND - e.h, '#ffb347', 8); }
    } else if (e.t === 'pumpkin') {
      if (!e.hit && overlap(pb, { l: e.x - e.w / 2 + 8, r: e.x + e.w / 2 - 8, t: GROUND - e.h + 10, b: GROUND })) { e.hit = true; hurt(); }
    } else if (e.t === 'ghost') {
      if (e.kind === 'spirit') e.x -= 45 * dt;
      const gy = e.y0 + Math.sin(totalT * 2.4 + e.ph) * (e.kind === 'spirit' ? 38 : 22);
      if (!e.hit && overlap(pb, { l: e.x - 22, r: e.x + 22, t: gy - 26, b: gy + 26 })) { e.hit = true; hurt(); }
    } else if (e.t === 'mon') {
      if (e.x - camX < W + 80) e.active = true;
      if (!e.active) continue;
      e.anim += dt;
      if (e.state === 'walk') {
        e.x += e.vx * dt;
        if (e.hop) { const t = e.anim % 1.4, u = (t - 0.8) / 0.6; e.y = t < 0.8 ? GROUND : GROUND - 4 * u * (1 - u) * 100; }
        const mb = { l: e.x - 30, r: e.x + 30, t: e.y - 108, b: e.y };
        if (overlap(pb, mb)) {
          if (P.vy > 0 && P.prevY <= mb.t + 34) {
            e.state = 'dizzy'; e.vy = -520; e.vx = 160; stomps++; score += 50;
            P.vy = holding ? -780 : -620; SFX.stomp(); sparkle(e.x, mb.t, '#f6c453', 14); popup(e.x, mb.t - 10, '+50');
          } else hurt();
        }
      } else {
        e.x += e.vx * dt; e.vy += GRAV * dt * 0.7; e.y += e.vy * dt; e.rot += dt * 9;
        if (e.y > H + 300) e.dead = true;
      }
    } else if (!e.dead) {
      const cy = e.y + Math.sin(totalT * 4 + e.x) * 5;
      if (Math.hypot(e.x - P.x, cy - (P.y - 60)) < e.r + 34) {
        e.dead = true;
        if (e.t === 'fish') { fishN++; score += 10; SFX.fish(); sparkle(e.x, cy, '#dfe9f2', 6); popup(e.x, cy - 20, '+10'); }
        if (e.t === 'star') { starN++; score += 100; SFX.star(); sparkle(e.x, cy, '#f6c453', 22); popup(e.x, cy - 24, '星星 +100', '#ffe27a'); }
        if (e.t === 'magic') usePower(e.kind, e.x, cy);
        if (e.t === 'heart') { hearts = Math.min(5, hearts + 1); SFX.heart(); sparkle(e.x, cy, '#ff6b81', 14); popup(e.x, cy - 24, '+1 愛心', '#ff9fb0'); }
      }
    }
  }

  if (lvl === 3 && P.x >= END && !B) startBoss();
  if (B) { updateBoss(dt); return; }
  if (P.x >= END && P.onGround) finishLevel();
}

function finishLevel() {
  score += hearts * 50;
  if (score > bests[lvl]) { bests[lvl] = score; store(lvl === 1 ? 'kk_best' : 'kk_best' + lvl, String(score)); }
  if (lvl === 1) { unlocked2 = true; store('kk_unlock2', '1'); }
  if (lvl === 2) { unlocked3 = true; store('kk_unlock3', '1'); }
  SFX.win(); setState('win');
}

// ---------- 第 3 關魔王：怪物熊容容 ----------
// 牠會從右邊衝過來；跳起來踩牠的頭 3 次，附身的紫色怪就會飛走
const BOSS_H = 150, BOSS_HOME = 400;
function startBoss() {
  B = { x: END + BOSS_HOME + 300, y: GROUND, hp: 3, mode: 'enter', t: 0, anim: 0 };
  popup(END + 60, GROUND - 230, '怪物熊來了！', '#ffb3c7');
}
function updateBoss(dt) {
  B.t += dt; B.anim += dt; B.flash = Math.max(0, (B.flash || 0) - dt);
  const home = END + BOSS_HOME, left = camX - 180;
  if (B.mode === 'enter') { B.x -= 260 * dt; if (B.x <= home) { B.x = home; B.mode = 'roar'; B.t = 0; SFX.thunder(); } }
  else if (B.mode === 'roar') { if (B.t > (B.hp === 3 ? 1.3 : 0.9)) { B.mode = 'charge'; B.t = 0; } }
  else if (B.mode === 'charge') {
    B.x -= (300 + (3 - B.hp) * 40) * dt;
    if (B.x < left) { B.x = camX + W + 180; B.mode = 'enter'; }
  } else if (B.mode === 'stunned') {
    if (B.t > 0.9) { B.mode = 'back'; B.t = 0; }
  } else if (B.mode === 'back') {
    B.x += 380 * dt; if (B.x >= home) { B.x = home; B.mode = 'roar'; B.t = 0; }
  } else if (B.mode === 'free') {
    B.x += (home - B.x) * Math.min(1, dt * 4);
    if (B.t > 1.6) finishLevel();
    return;
  }
  if (B.mode !== 'charge') return;
  const pb = pBox(), bb = { l: B.x - 36, r: B.x + 36, t: B.y - BOSS_H + 14, b: B.y };
  if (!overlap(pb, bb)) return;
  if (P.vy > 0 && P.prevY <= bb.t + 40) {
    B.hp--; stomps++; score += 150; SFX.stomp(); sparkle(B.x, bb.t, '#c58bff', 18); popup(B.x, bb.t - 20, '+150', '#e3c6ff');
    P.vy = -760;
    if (B.hp <= 0) {
      B.mode = 'free'; B.t = 0; SFX.star();
      particles.push({ x: B.x, y: bb.t, vx: 160, vy: -260, life: 2.2, spirit: true, s: 0 });
    } else { B.mode = 'stunned'; B.t = 0; }
  } else if (P.inv <= 0) {
    hurt();
  }
}

// ---------- 繪圖 ----------
function drawImg(im, cx, bottom, h, opt = {}) {
  if (!im) return;
  const w = im.width * h / im.height;
  ctx.save();
  ctx.translate(cx, bottom - h / 2);
  if (opt.rot) ctx.rotate(opt.rot);
  if (opt.flip) ctx.scale(-1, 1);
  if (opt.sy) ctx.scale(1 / opt.sy, opt.sy);
  if (opt.alpha != null) ctx.globalAlpha = opt.alpha;
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function text(s, x, y, size, color = '#fff', o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke !== 0) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke || Math.max(4, size / 6); ctx.strokeStyle = o.strokeColor || '#1b1530'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function bubble(x, y, s, size = 30) {
  ctx.save();
  ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(s).width + 44, h = size + 30;
  ctx.fillStyle = '#fffdf6'; ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 4;
  roundRect(x - w / 2, y - h, w, h, h / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 18, y - 3); ctx.lineTo(x - 30, y + 22); ctx.lineTo(x + 2, y - 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffdf6'; ctx.fillRect(x - 17, y - 7, 18, 6);
  ctx.restore();
  text(s, x, y - h / 2, size, '#d4532c', { stroke: 0 });
}

function drawBg() {
  if (!bgTile) { ctx.fillStyle = '#2b2046'; ctx.fillRect(0, 0, W, H); return; }
  const off = -(((camX % bgTileW) + bgTileW) % bgTileW);
  for (let x = off; x < W; x += bgTileW) ctx.drawImage(bgTile, x, 0, bgTileW, H);
  if (lvl === 2 && state !== 'title') { ctx.fillStyle = 'rgba(120,20,60,.2)'; ctx.fillRect(0, 0, W, H); }
  if (lvl === 3 && state !== 'title') { ctx.fillStyle = 'rgba(70,20,130,.24)'; ctx.fillRect(0, 0, W, H); }
}

function drawEntities() {
  for (const e of level) {
    if (e.dead && e.t !== 'mon') continue;
    const sx = e.x - camX;
    if (sx < -150 || sx > W + 150) continue;
    if (e.t === 'circle') {
      ctx.save(); ctx.globalAlpha = 0.55 + 0.25 * Math.sin(totalT * 3 + e.x);
      const im = IMG.circle; if (im) { const w = 230, h = w * im.height / im.width * 0.45; ctx.drawImage(im, sx - w / 2, GROUND - h * 0.7, w, h); }
      ctx.restore();
    } else if (e.t === 'candle') {
      ctx.save(); ctx.globalAlpha = 0.25 + 0.15 * Math.sin(totalT * 12 + e.x);
      ctx.fillStyle = '#ffcf6b'; ctx.beginPath(); ctx.arc(sx, GROUND - e.h - 4, 34, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      drawImg(IMG.candle, sx, GROUND + 4, e.h + 34, { alpha: e.hit ? 0.6 : 1 });
    } else if (e.t === 'pit') {
      ctx.save();
      ctx.fillStyle = '#0c0716';
      ctx.beginPath();
      ctx.moveTo(sx - e.w / 2, H); ctx.lineTo(sx - e.w / 2 + 6, GROUND - 22);
      for (let i = 1; i < 6; i++) ctx.lineTo(sx - e.w / 2 + i * e.w / 6, GROUND - 22 + (i % 2 ? -8 : 6));
      ctx.lineTo(sx + e.w / 2 - 6, GROUND - 22); ctx.lineTo(sx + e.w / 2, H); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3a2516'; ctx.lineWidth = 5; ctx.stroke();
      ctx.restore();
    } else if (e.t === 'crate') drawImg(IMG.crate, sx, GROUND + 4, e.h + 4);
    else if (e.t === 'pumpkin') drawImg(IMG.pumpkin, sx, GROUND + 4, e.h + 6);
    else if (e.t === 'ghost') {
      const gy = e.y0 + Math.sin(totalT * 2.4 + e.ph) * (e.kind === 'spirit' ? 38 : 22);
      drawImg(e.kind === 'spirit' ? IMG.spirit : IMG.ghost, sx, gy + 38, e.kind === 'spirit' ? 88 : 76, { alpha: e.hit ? 0.45 : 0.92, rot: Math.sin(totalT * 3 + e.ph) * 0.12 });
    } else if (e.t === 'mon') {
      if (e.dead) continue;
      let im = IMG[Math.floor(e.anim * 6) % 2 ? 'mon_2' : 'mon_1'];
      if (e.state === 'walk' && sx - (P.x - camX) < 260 && sx - (P.x - camX) > 60) im = IMG.mon_3;
      if (e.state === 'dizzy') im = IMG.mon_4;
      const bob = e.state === 'walk' ? Math.abs(Math.sin(e.anim * 9)) * 5 : 0;
      drawImg(im, sx, e.y - bob, CHAR_H, { rot: e.state === 'dizzy' ? e.rot : 0 });
    } else {
      const cy = e.y + Math.sin(totalT * 4 + e.x) * 5;
      if (e.t === 'star') {
        ctx.save(); ctx.globalAlpha = 0.35 + 0.25 * Math.sin(totalT * 5);
        ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(sx, cy, 40, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        drawImg(IMG.star, sx, cy + 30, 60, { rot: Math.sin(totalT * 2) * 0.2 });
      } else if (e.t === 'heart') drawImg(IMG.heart, sx, cy + 24, 48, { sy: 1 + Math.sin(totalT * 8) * 0.06 });
      else if (e.t === 'magic') {
        ctx.save(); ctx.globalAlpha = 0.35 + 0.2 * Math.sin(totalT * 5);
        ctx.fillStyle = '#c58bff'; ctx.beginPath(); ctx.arc(sx, cy, 46, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        drawImg(IMG['item_' + e.kind], sx, cy + 34, 68, { rot: Math.sin(totalT * 3) * 0.1 });
      }
      else drawImg(IMG.fish, sx, cy + 16, 32);
    }
  }
}

// 角色頭上的名字牌
function nameTag(name, cx, headTop) {
  ctx.save();
  ctx.font = `900 17px ${FONT}`;
  const w = ctx.measureText(name).width + 18, y = headTop - 16;
  ctx.fillStyle = 'rgba(255,253,246,.9)'; ctx.strokeStyle = 'rgba(27,21,48,.85)'; ctx.lineWidth = 2;
  roundRect(cx - w / 2, y - 12, w, 24, 12); ctx.fill(); ctx.stroke();
  ctx.restore();
  text(name, cx, y + 1, 17, '#3a2a58', { stroke: 0 });
}
// 畫一個有名字的朋友
function friend(img, name, cx, lift = 0, h = CHAR_H, opt = {}) {
  drawImg(img, cx, GROUND + 2 - lift, h, opt);
  if (name) nameTag(name, cx, GROUND - lift - h + 4);
}

function drawFriends() {
  if (lvl === 3) { drawLevel3End(); return; }
  const base = END - camX;
  if (base + 250 > W + 200) return;
  const hopY = (k, amp) => state === 'win' ? Math.abs(Math.sin(stateT * 6 + k)) * amp : 0;
  if (lvl === 1) {
    // 第 1 關終點：容容、角角，小魔法師模式還有顆顆
    const rx = base + 240, jx = base + 345, kx = base + 450;
    friend(IMG.rongrong, '容容', rx, hopY(0, 40));
    friend(IMG.jiao_1, '角角', jx, hopY(1.4, 30));
    if (isWiz()) friend(IMG.kk_front, '顆顆', kx, hopY(2.6, 34));
    if (state === 'win' && stateT > 0.4) bubble(rx + 40, GROUND - CHAR_H - 30 - hopY(0, 40), 'Be happy!', 26);
  } else {
    // 第 2 關：大狗擋在前面大喊 No，怪物貓嚇得逃走，容容和角角在後面跳
    const dx = base + 230, rx = base + 370, jx = base + 460, kx = base + 550;
    friend(IMG.rongrong, '容容', rx, hopY(0, 40), CHAR_H * 0.92);
    friend(IMG.jiao_1, '角角', jx, hopY(1.4, 30), CHAR_H * 0.92);
    if (isWiz()) friend(IMG.kk_front, '顆顆', kx, hopY(2.6, 34), CHAR_H * 0.92);
    const shake = state === 'win' && stateT < 1.2 ? Math.sin(stateT * 50) * 4 : 0;
    friend(IMG.dog, '大狗', dx + shake, 0, CHAR_H * 1.25);
    if (state === 'win') {
      bubble(dx - 62, GROUND - 92, 'No!', 34);
      for (let i = 0; i < 3; i++) {
        const fx = dx - 110 - i * 75 - stateT * 520;
        drawImg(IMG.mon_1, fx, GROUND - Math.abs(Math.sin(stateT * 10 + i)) * 30, CHAR_H * 0.9, { rot: -0.15 });
      }
    }
  }
}

function drawLevel3End() {
  if (!B) return;
  const bx = B.x - camX, BH = CHAR_H * 1.15;
  // 怪物熊／變回來的容容
  if (B.mode === 'free' || state === 'win') {
    const wob = Math.sin(totalT * 5) * 0.08;
    drawImg(IMG.rongrong, bx, GROUND + 2, CHAR_H, { rot: wob });
    nameTag('容容', bx, GROUND - CHAR_H + 4);
    if (state !== 'win' || stateT < 1.2) for (let i = 0; i < 3; i++) {
      const a = totalT * 4 + i * 2.1;
      drawImg(IMG.star, bx + Math.cos(a) * 34, GROUND - CHAR_H - 2 + Math.sin(a) * 8, 18);
    }
  } else {
    let im = IMG[Math.floor(B.anim * 8) % 2 ? 'bear_1' : 'bear_2'], opt = {};
    if (B.mode === 'roar') { im = IMG.bear_3; opt.rot = Math.sin(totalT * 40) * 0.04; }
    if (B.mode === 'stunned') { im = IMG.bear_4; opt.rot = Math.sin(totalT * 10) * 0.15; }
    if (B.mode === 'back') opt.flip = true;
    const bob = B.mode === 'charge' ? Math.abs(Math.sin(B.anim * 12)) * 8 : 0;
    drawImg(im, bx, GROUND + 2 - bob, BH, opt);
    if (B.mode === 'roar' && B.hp === 3) bubble(bx - 30, GROUND - BH - 6, '吼～！', 28);
  }
  if (state !== 'win') return;
  // 結局：照漫畫 3ch 的對話
  const jx0 = END + 230 - camX, t = stateT;
  // 小魔法師模式：顆力跑來站在旁邊，由顆力問「Are you ok?」（照漫畫）；貓咪模式主角就是顆力
  const kx = isWiz() ? P.x - camX - 75 : P.x - camX;
  if (isWiz()) friend(IMG.keli_1, '顆力', kx);
  if (t < 2.8) {
    friend(IMG.jiao_1, '角角', jx0);
    if (t > 0.3 && t < 1.6) bubble(kx + 50, GROUND - CHAR_H - 44, 'Are you ok?', 22);
    if (t > 1.5 && t < 2.8) bubble(jx0 + 30, GROUND - CHAR_H - 44, 'I… fine.', 22);
  } else if (t < 4.2) {
    friend(IMG.jiao_2, '角角', jx0 + (t - 2.8) * 520, Math.abs(Math.sin(t * 14)) * 10);
  }
  if (t > 3.4) {
    const a = Math.min(1, (t - 3.4) / 0.6), cx = W - 120;
    ctx.save(); ctx.globalAlpha = a * (0.35 + 0.15 * Math.sin(totalT * 4));
    const g = ctx.createRadialGradient(cx, GROUND - 60, 10, cx, GROUND - 60, 150);
    g.addColorStop(0, '#c58bff'); g.addColorStop(1, 'rgba(197,139,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 160, GROUND - 220, 320, 260); ctx.restore();
    drawImg(IMG.jiao_3, cx, GROUND + 10, CHAR_H * 1.05, { alpha: a });
    if (a > 0.6) nameTag('角角？', cx, GROUND + 10 - CHAR_H * 1.05 + 6);
    if (t > 3.9) bubble(kx + 40, GROUND - CHAR_H - 44, '!?', 28);
  }
}

function drawPlayer() {
  const sx = P.x - camX;
  if (P.inv > 0 && P.ghostT <= 0 && state === 'play' && Math.floor(P.inv * 12) % 2) return;
  let im;
  const h = hero();
  if (state === 'over' || P.hurtT > 0) im = IMG[h.hurt];
  else if (state === 'win') im = IMG[lvl === 3 ? h.stand : h.jump];
  else if (!P.onGround) im = P.castT > 0 && h.cast ? IMG[h.cast] : IMG[h.jump];
  else if (B && P.x >= END) im = IMG[h.stand];
  else if (P.castT > 0 && h.cast) im = IMG[h.cast];
  else if (Math.abs(P.vx) < 30) im = IMG[h.stand];
  else im = Math.floor(P.walkT * 8) % 2 ? IMG[h.w1] : IMG[h.w2];
  let bottom = P.y;
  if (state === 'win') bottom = GROUND - Math.abs(Math.sin(stateT * 6 + 0.7)) * 36;
  const tilt = P.onGround && state === 'play' && Math.abs(P.vx) > 30 ? Math.sin(P.walkT * 16) * 0.04 : 0;
  drawImg(im, sx, bottom + 2, CHAR_H, { rot: tilt, flip: P.face < 0 && state === 'play', alpha: P.ghostT > 0 ? 0.4 + 0.15 * Math.sin(totalT * 10) : undefined });
  if (!isWiz()) nameTag(lvl === 3 ? '顆力' : '顆顆', sx, bottom - CHAR_H + 6);
}

function drawHUD() {
  for (let i = 0; i < hearts; i++) drawImg(IMG.heart, 34 + i * 38, 52, 32);
  const pw = P.ghostT > 0 ? ['item_vase', P.ghostT / 5] : P.tripleT > 0 ? ['item_box', P.tripleT / 6] : null;
  if (pw && state === 'play') {
    drawImg(IMG[pw[0]], 36, 112, 40);
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.3)'; roundRect(62, 90, 110, 12, 6); ctx.fill();
    ctx.fillStyle = '#ffe27a'; roundRect(62, 90, 110 * pw[1], 12, 6); ctx.fill(); ctx.restore();
  }
  // 進度條：顆顆 → 容容
  const bx = 330, bw = 300, by = 30, prog = Math.min(1, P.x / END);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; roundRect(bx - 6, by - 8, bw + 12, 16, 8); ctx.fill();
  ctx.fillStyle = '#f6c453'; roundRect(bx, by - 4, bw * prog, 8, 4); ctx.fill();
  ctx.restore();
  text('第 ' + lvl + ' 關', bx - 46, by, 18, '#efe6ff', { stroke: 5 });
  drawImg(IMG[hero().icon], bx + bw * prog, by + 20, 40);
  drawImg(lvl === 3 ? IMG.bear_1 : IMG.rongrong, bx + bw + 24, by + 20, 40);
  if (B && B.hp > 0) {
    text('怪物熊', W / 2 - 90, 92, 24, '#ffd1e0', { stroke: 6 });
    for (let i = 0; i < 3; i++) drawImg(IMG.spirit, W / 2 - 20 + i * 48, 118, 50, { alpha: i < Math.ceil(B.hp - 0.01) ? (i < Math.floor(B.hp + 0.01) ? 1 : 0.55) : 0.18 });
  }
  // 右上：魚乾、星星
  drawImg(IMG.fish, W - 262, 50, 26);
  text('× ' + fishN, W - 238, 38, 26, '#fff', { align: 'left' });
  for (let i = 0; i < 3; i++) drawImg(IMG.star, W - 100 + i * 34, 54, 32, { alpha: i < starN ? 1 : 0.28 });
}

function overlay(alpha) { ctx.fillStyle = `rgba(16,10,30,${alpha})`; ctx.fillRect(0, 0, W, H); }

function panel(x, y, w, h) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,250,236,.96)'; ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 5;
  roundRect(x, y, w, h, 22); ctx.fill(); ctx.stroke(); ctx.restore();
}

function drawTitle() {
  overlay(0.35);
  const bob = Math.sin(totalT * 3) * 8;
  text('小小魔法師闖鬼屋', W / 2, 108, 66, '#f6c453', { stroke: 12 });
  text('小里肌的漫畫小遊戲・共 3 關', W / 2, 170, 24, '#efe6ff', { stroke: 6 });
  drawImg(isWiz() ? IMG.wiz_wave : IMG.kk_front, 150, 420 + bob * 0.3, 210, { rot: Math.sin(totalT * 2.4) * 0.05 });
  ctx.save(); ctx.fillStyle = 'rgba(255,250,236,.92)'; ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 4;
  roundRect(16, 16, 280, 52, 26); ctx.fill(); ctx.stroke(); ctx.restore();
  text('主角：' + (isWiz() ? '小魔法師' : '貓咪') + '　點這裡換', 156, 42, 20, '#3a2a58', { stroke: 0 });
  drawImg(IMG.ghost, 710, 236 + bob, 70, { alpha: 0.85 });
  // 登場角色：顆顆、顆力、角角、容容
  const crew = [['kk_front', '顆顆'], ['keli_1', '顆力'], ['jiao_1', '角角'], ['rongrong', '容容']];
  crew.forEach(([k, n], i) => {
    const cx = 690 + i * 70, jump = Math.abs(Math.sin(totalT * 3 + i * 0.9)) * 6, hh = 118;
    drawImg(IMG[k], cx, 424 - jump, hh);
    nameTag(n, cx, 424 - jump - hh + 4);
  });
  panel(390, 228, 250, 150);
  const lines = touchUI
    ? ['左半邊按住拖曳：走路', '右下：跳' + (isWiz() ? '、魔法' : ''), '按久一點跳更高', '踩怪物的頭也可以', '收集 3 顆星星！']
    : ['A D／← →：走路', '空白鍵或 W：跳', isWiz() ? '滑鼠左鍵：魔法星星' : '按久一點跳更高', '踩怪物的頭也可以', '收集 3 顆星星！'];
  lines.forEach((s, i) => text(s, 515, 252 + i * 26, 19, '#3a2a58', { stroke: 0, weight: 700 }));
  levelButton(W / 2 - 230, 1, true);
  levelButton(W / 2, 2, unlocked2);
  levelButton(W / 2 + 230, 3, unlocked3);
  const hi = Math.max(bests[1], bests[2], bests[3]);
  if (hi > 0) text('最高分 ' + hi, W - 20, 30, 18, '#efe6ff', { align: 'right', stroke: 5 });
  text('v' + VERSION, W - 14, H - 14, 16, '#efe6ff', { align: 'right', stroke: 4 });
  if (pendingUpdate) text('有新版本 v' + pendingUpdate + '，更新中…', W / 2, H - 14, 18, '#ffe27a', { stroke: 5 });
}

function levelButton(cx, n, open) {
  const pulse = open && Math.floor(totalT * 2) % 2 === 0 ? 1 : 0;
  ctx.save();
  ctx.fillStyle = open ? ['', '#f6c453', '#f08a24', '#c58bff'][n] : 'rgba(60,50,90,.85)';
  ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 5;
  roundRect(cx - 105, 448 - pulse * 3, 210, 64, 32); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (open) text('第 ' + n + ' 關　開始', cx, 480 - pulse * 3, 26, '#2b1a10', { stroke: 0 });
  else { text('第 ' + n + ' 關', cx, 470, 22, '#d6cbf0', { stroke: 0 }); text('過第 ' + (n - 1) + ' 關解鎖', cx, 494, 15, '#b4a6d4', { stroke: 0, weight: 700 }); }
}

function drawControlsHint() {
  if (state !== 'play') return;
  if (touchUI) drawTouchControls();
  if (stateT > 5 || touchUI) return;
  const a = Math.min(1, (5 - stateT) / 0.8) * 0.9;
  ctx.save(); ctx.globalAlpha = a;
  text(isWiz() ? 'A D 或 ← → 移動　空白鍵跳　滑鼠左鍵放魔法星星' : 'A D 或 ← → 移動　空白鍵跳', W / 2, H - 34, 22, '#fff', { stroke: 6 });
  ctx.restore();
}

function drawTouchControls() {
  // 搖桿：手指按住時才出現
  if (stick) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(stick.x, stick.y, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (state === 'play' && stateT < 4) {
    ctx.save(); ctx.globalAlpha = Math.min(1, (4 - stateT) / 0.8) * 0.8;
    text('左半邊按住拖曳：走路（往上推也能跳）', W * 0.3, H - 40, 20, '#fff', { stroke: 5 }); ctx.restore();
  }
  const pad = (k, label, on, size) => {
    const b = BTN[k];
    ctx.save();
    ctx.fillStyle = on ? 'rgba(246,196,83,.5)' : 'rgba(255,255,255,.16)'; ctx.strokeStyle = on ? 'rgba(255,240,180,.95)' : 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.9; text(label, b.x, b.y + 1, size, '#fff', { stroke: 4 }); ctx.restore();
  };
  pad('jump', '跳', held('jump'), 30);
  if (isWiz()) pad('attack', '魔法', held('attack'), 22);
}

function drawBanner() {
  if (state !== 'play' || stateT > 2.2) return;
  const a = Math.min(1, stateT / 0.3) * Math.min(1, (2.2 - stateT) / 0.4);
  ctx.save(); ctx.globalAlpha = a;
  text(LEVELS[lvl].name, W / 2, 190, 44, '#f6c453', { stroke: 10 });
  if (lvl === 2) text('小心地板的破洞，怪物貓會跳喔！', W / 2, 244, 24, '#efe6ff', { stroke: 6 });
  if (lvl === 3) text('新角色顆力出場！小心蠟燭和紫色附身怪', W / 2, 244, 24, '#efe6ff', { stroke: 6 });
  ctx.restore();
}

function drawWin() {
  const t0 = lvl === 3 ? 4.6 : 0.8;
  if (stateT < t0) return;
  const a = Math.min(1, (stateT - t0) / 0.4);
  ctx.save(); ctx.globalAlpha = a;
  panel(250, 64, 460, 212);
  text(['', '找到容容了！', '大狗把怪物貓趕走了！', '容容得救了！'][lvl], W / 2, 102, 40, '#d4532c', { stroke: 0 });
  drawImg(IMG.fish, 312, 163, 30);
  text('魚乾 × ' + fishN, 340, 150, 24, '#3a2a58', { stroke: 0, align: 'left', weight: 700 });
  text((lvl === 3 ? '踩怪物 × ' : '打倒怪物貓 × ') + stomps, 515, 150, 24, '#3a2a58', { stroke: 0, align: 'left', weight: 700 });
  for (let i = 0; i < 3; i++) drawImg(IMG.star, W / 2 - 50 + i * 50, 218, 44, { alpha: i < starN ? 1 : 0.22 });
  text('分數 ' + score + (score >= bests[lvl] ? '　新紀錄！' : '　最高 ' + bests[lvl]), W / 2, 248, 24, '#3a2a58', { stroke: 0 });
  ctx.restore();
  if (lvl === 3) text('可是……角角在做什麼？未完待續', W / 2, 300, 24, '#e3c6ff', { stroke: 6 });
  if (stateT > (lvl === 3 ? 5.2 : 1.6) && Math.floor(totalT * 2) % 2 === 0) text(lvl < 3 ? '點一下進入第 ' + (lvl + 1) + ' 關' : '點一下回到標題', W / 2, 520, 28, '#fff', { stroke: 7 });
}

function drawOver() {
  overlay(Math.min(0.55, stateT));
  if (stateT < 0.5) return;
  text('哎呀！被怪物貓嚇到了', W / 2, 190, 46, '#ffb36b', { stroke: 10 });
  text('魚乾 × ' + fishN + '　星星 × ' + starN, W / 2, 252, 26, '#efe6ff', { stroke: 6 });
  if (stateT > 1.0 && Math.floor(totalT * 2) % 2 === 0) text('點一下再試一次', W / 2, 320, 30, '#fff', { stroke: 7 });
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  if (state !== 'title') {
    drawEntities(); drawFriends(); drawPlayer();
    for (const s of shots) drawImg(IMG.magic_star, s.x - camX, s.y + 28, 56, { rot: Math.sin(totalT * 20) * 0.08, flip: s.dir < 0 });
    drawControlsHint();
  }
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
    ctx.translate(p.x - camX, p.y);
    if (p.spirit) { ctx.globalAlpha = Math.min(1, p.life); ctx.rotate(Math.sin(p.life * 8) * 0.3); const im = IMG.spirit; if (im) ctx.drawImage(im, -36, -40, 72, 72 * im.height / im.width); }
    else if (p.confetti) { ctx.rotate(p.life * 6); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
    else { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  for (const p of popups) { ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2); text(p.text, p.x - camX, p.y, 24, p.color, { stroke: 5 }); ctx.restore(); }
  if (flash > 0) { ctx.fillStyle = `rgba(235,240,255,${Math.min(0.75, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else {
    drawHUD();
    drawBanner();
    if (state === 'win') drawWin();
    if (state === 'over') drawOver();
  }
}

// ---------- 尺寸 ----------
function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingQuality = 'high';
}
new ResizeObserver(resize).observe(canvas);
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else if (state !== 'title' && !muted && ac) bgm.play().catch(() => {}); });

// ---------- 版本檢查與自動更新（有 manifest 的獨立版才啟用）----------
const STANDALONE = !!document.querySelector('link[rel="manifest"]');
let pendingUpdate = null, swReg = null;
async function checkUpdate() {
  if (!STANDALONE) return;
  try { if (swReg) swReg.update(); } catch (e) {}
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.version && j.version !== VERSION) pendingUpdate = j.version;
  } catch (e) {}
}
// 有新版本時，等玩家回到標題畫面再重新載入，不會打斷正在玩的關卡
function applyUpdate() {
  if (!pendingUpdate) return;
  let tried = null;
  try { tried = sessionStorage.getItem('kk_upd'); } catch (e) {}
  if (tried === pendingUpdate) return;   // 已經重新載入過還是舊的（快取），不要一直重載
  try { sessionStorage.setItem('kk_upd', pendingUpdate); } catch (e) {}
  location.replace(location.pathname + '?v=' + encodeURIComponent(pendingUpdate));
}
if (STANDALONE) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg; }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  window.addEventListener('pageshow', checkUpdate);
  setInterval(checkUpdate, 5 * 60 * 1000);
  checkUpdate();
}
const verEl = document.getElementById('ver'); if (verEl) verEl.textContent = 'v' + VERSION;

// ---------- 啟動 ----------
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  update(dt); render();
  requestAnimationFrame(loop);
}
async function boot(data) {
  if (data && data.bests) { bests[1] = Math.max(bests[1], data.bests[1] || 0); bests[2] = Math.max(bests[2], data.bests[2] || 0); }
  if (data && data.unlocked2) unlocked2 = true;
  if (data && data.unlocked3) unlocked3 = true;
  if (data && data.heroChoice) heroChoice = data.heroChoice;
  if (data && data.bests) bests[3] = Math.max(bests[3], data.bests[3] || 0);
  resize();
  ctx.fillStyle = '#2b2046'; ctx.fillRect(0, 0, W, H);
  text('載入中…', W / 2, H / 2, 32, '#efe6ff', { stroke: 0 });
  const ims = await Promise.all(NAMES.map(n => loadImg('assets/' + n + '.png')));
  NAMES.forEach((n, i) => IMG[n] = ims[i]);
  const bg = await loadImg('assets/bg.jpg');
  if (bg) {
    // 原圖接上左右翻轉的自己，讓背景可以無縫重複
    const h = H, w = Math.round(bg.width * h / bg.height);
    bgTile = document.createElement('canvas'); bgTile.width = w * 2; bgTile.height = h; bgTileW = w * 2;
    const c = bgTile.getContext('2d');
    c.drawImage(bg, 0, 0, w, h);
    c.save(); c.translate(w * 2, 0); c.scale(-1, 1); c.drawImage(bg, 0, 0, w, h); c.restore();
  }
  try { await Promise.race([document.fonts.load(`900 40px "Chiron GoRound TC"`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  requestAnimationFrame(loop);
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ bests, unlocked2, unlocked3, heroChoice }));
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
